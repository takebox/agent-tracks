name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate track frontmatter
        run: python scripts/validate-tracks
      - name: Check shell scripts
        run: bash -n tracks/autoreview/scripts/test-review-harness
      - name: Check Python scripts
        run: python -m py_compile scripts/install-tracks scripts/install-tracks.test.py scripts/validate-tracks scripts/validate-tracks.test.py tracks/autoreview/scripts/autoreview tracks/autoreview/scripts/test-review-harness.py tracks/autoreview/scripts/autoreview_test.py
      - name: Run repository script tests
        run: |
          python scripts/install-tracks.test.py
          python scripts/validate-tracks.test.py
      - name: Run autoreview self-tests
        run: |
          python tracks/autoreview/scripts/autoreview --self-test-config-defaults
          python tracks/autoreview/scripts/autoreview --self-test-fallback-scope
          python tracks/autoreview/scripts/autoreview --self-test-engine-isolation
          python tracks/autoreview/scripts/autoreview --self-test-json-array-parser
          python tracks/autoreview/scripts/autoreview --self-test-opencode-jsonl-parser
          python tracks/autoreview/scripts/autoreview --self-test-opencode-isolation
          python tracks/autoreview/scripts/autoreview --self-test-cursor-jsonl-parser
      - name: Run Python tests
        run: python -m unittest tracks/autoreview/scripts/autoreview_test.py tracks.autoreview.tests.test_autoreview_hardening
      - name: Check Node scripts
        run: |
          node --check tracks/agent-transcript/scripts/agent-transcript
          node --check tracks/beam/scripts/beam
          node --check tracks/beam/scripts/beam-session.js
      - name: Run Node tests
        run: node --test tracks/agent-transcript/scripts/agent-transcript.test.mjs tracks/beam/scripts/beam.test.mjs tracks/session-viewer/scripts/session-viewer.test.ts
